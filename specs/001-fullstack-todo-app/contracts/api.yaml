openapi: 3.1.0
info:
  title: Todo API
  description: RESTful API for the Full-Stack Todo Web Application (Phase II)
  version: 1.0.0
  contact:
    name: Hackathon Team

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.todo.example.com
    description: Production server

security:
  - bearerAuth: []

paths:
  /api/{user_id}/tasks:
    parameters:
      - $ref: '#/components/parameters/userId'

    get:
      operationId: listTasks
      summary: List all tasks for a user
      description: Returns all tasks belonging to the authenticated user. Requires JWT token with matching user_id.
      tags:
        - Tasks
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: createTask
      summary: Create a new task
      description: Creates a new task for the authenticated user. Requires JWT token with matching user_id.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/{user_id}/tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/taskId'

    get:
      operationId: getTask
      summary: Get a specific task
      description: Returns details of a specific task. Requires JWT token with matching user_id.
      tags:
        - Tasks
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateTask
      summary: Update a task
      description: Updates title and/or description of a task. Requires JWT token with matching user_id.
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Permanently removes a task. Requires JWT token with matching user_id.
      tags:
        - Tasks
      responses:
        '204':
          description: Task deleted successfully (no content)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/{user_id}/tasks/{task_id}/complete:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/taskId'

    patch:
      operationId: toggleTaskComplete
      summary: Toggle task completion status
      description: Toggles the completed status of a task. If pending, marks as complete. If complete, marks as pending. Requires JWT token with matching user_id.
      tags:
        - Tasks
      responses:
        '200':
          description: Task completion status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      description: Returns server health status. No authentication required.
      tags:
        - System
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token issued by Better Auth

  parameters:
    userId:
      name: user_id
      in: path
      required: true
      description: User ID (must match JWT sub claim)
      schema:
        type: string
        example: "user_2abc123def456"

    taskId:
      name: task_id
      in: path
      required: true
      description: Task ID
      schema:
        type: integer
        minimum: 1
        example: 42

  schemas:
    Task:
      type: object
      description: A todo task
      required:
        - id
        - user_id
        - title
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Unique task identifier
          example: 42
        user_id:
          type: string
          description: ID of the user who owns this task
          example: "user_2abc123def456"
        title:
          type: string
          description: Task title
          minLength: 1
          maxLength: 200
          example: "Buy groceries"
        description:
          type: string
          nullable: true
          description: Optional task description
          maxLength: 1000
          example: "Milk, eggs, bread, butter"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        created_at:
          type: string
          format: date-time
          description: When the task was created
          example: "2026-01-18T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
          example: "2026-01-18T14:45:00Z"

    TaskCreate:
      type: object
      description: Request body for creating a task
      required:
        - title
      properties:
        title:
          type: string
          description: Task title (required)
          minLength: 1
          maxLength: 200
          example: "Buy groceries"
        description:
          type: string
          nullable: true
          description: Optional task description
          maxLength: 1000
          example: "Milk, eggs, bread, butter"

    TaskUpdate:
      type: object
      description: Request body for updating a task
      properties:
        title:
          type: string
          description: New task title (optional)
          minLength: 1
          maxLength: 200
          example: "Buy groceries and snacks"
        description:
          type: string
          nullable: true
          description: New task description (optional)
          maxLength: 1000
          example: "Milk, eggs, bread, butter, chips"

    Error:
      type: object
      description: Error response
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable error message
          example: "Task not found"
        code:
          type: string
          description: Machine-readable error code (optional)
          example: "NOT_FOUND"

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Title is required"
            code: "VALIDATION_ERROR"

    Unauthorized:
      description: Unauthorized - missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Invalid token"
            code: "UNAUTHORIZED"

    Forbidden:
      description: Forbidden - user does not own this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Access denied"
            code: "FORBIDDEN"

    NotFound:
      description: Not found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Task not found"
            code: "NOT_FOUND"

tags:
  - name: Tasks
    description: Task management operations
  - name: System
    description: System health and status
